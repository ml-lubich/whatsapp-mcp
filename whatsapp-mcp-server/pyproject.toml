[project]
name = "mac-wa-mcp"
version = "0.1.0"
description = "wa-mcp MCP server (stdio). Product family: wa-mcp. Script: wa-mcp"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ml-lubich" }]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/whatsapp-mcp"
Repository = "https://github.com/ml-lubich/whatsapp-mcp"

[project.scripts]
wa-mcp = "main:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "whatsapp", "audio"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
addopts = "--cov=main --cov=whatsapp --cov=audio --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.report]
fail_under = 85
