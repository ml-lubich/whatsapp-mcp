[project]
name = "mac-wa"
version = "0.1.0"
description = "Gradient-styled operator CLI for the local WhatsApp bridge + MCP stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/whatsapp-mcp"
Repository = "https://github.com/ml-lubich/whatsapp-mcp"

[project.scripts]
wa = "wa_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
addopts = "--cov=wa_cli --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wa_cli"]
